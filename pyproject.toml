[project]
name = "sentinel-trading"
version = "0.1.0"
description = "Unified trading orchestration: one brain, one risk manager, many workers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "San" }]

[project.scripts]
sentinel = "sentinel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*", "adapters*", "workers*"]
